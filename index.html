<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroOS Terminal</title>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --bg-card: #121216;
            --border-color: #222227;
            --accent-blue: #2f80ed;
            --accent-bro: #ff3366;
            --text-main: #f4f4f7;
            --text-muted: #8a8a98;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--bg-card); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .sidebar-btn { background: #1a1a22; border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; font-weight: 500; font-size: 14px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-btn:hover { background: #22222c; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { padding: 10px; border-radius: 6px; font-size: 13px; color: var(--text-muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover, .history-item.active { background: #1a1a22; color: var(--text-main); }
        .main-chat { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; background: #070709; }
        .header { height: 60px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--bg-card); }
        .header-title { font-weight: 600; font-size: 16px; letter-spacing: -0.3px; }
        .key-btn { font-size: 12px; background: none; border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .key-btn:hover { border-color: var(--text-muted); color: var(--text-main); }
        .chat-box { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box; }
        .msg-row { display: flex; width: 100%; }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.ai { justify-content: flex-start; }
        .msg-bubble { max-width: 70%; padding: 14px 18px; border-radius: 12px; line-height: 1.5; font-size: 15px; word-break: break-word; }
        .user .msg-bubble { background: #1c1c24; border: 1px solid var(--border-color); color: var(--text-main); border-bottom-right-radius: 2px; }
        .ai .msg-bubble { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); border-bottom-left-radius: 2px; }
        .msg-attachment { font-size: 12px; color: var(--accent-blue); margin-top: 8px; background: #141b2b; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(47,128,237,0.2); width: fit-content; }
        .gen-image-container { margin-top: 10px; position: relative; max-width: 300px; }
        .gen-image { width: 100%; border-radius: 8px; border: 1px solid var(--border-color); display: block; }
        .dl-btn { margin-top: 8px; display: inline-flex; align-items: center; background: #1c1c24; border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; text-decoration: none; font-weight: 500; }
        .dl-btn:hover { background: #252530; }
        .input-wrapper { padding: 0 24px 24px 24px; background: transparent; }
        .input-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; padding: 8px 12px; }
        .input-row { display: flex; align-items: center; }
        textarea { flex: 1; background: transparent; border: none; color: var(--text-main); outline: none; font-size: 15px; resize: none; padding: 8px 4px; height: 24px; font-family: inherit; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 1px solid #1c1c24; margin-top: 6px; }
        .tool-group { display: flex; gap: 8px; align-items: center; }
        .icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { color: var(--text-main); background: #1a1a22; }
        .send-btn { background: var(--text-main); color: var(--bg-main); border: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; }
        .send-btn:hover { background: #ffffff; }
        .preview-pane { display: none; padding: 6px; background: #1a1a22; border-radius: 6px; margin-bottom: 6px; font-size: 12px; color: var(--text-muted); justify-content: space-between; align-items: center; }
        .preview-pane span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
        .preview-remove { color: var(--accent-bro); cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="sidebar-btn" onclick="startNewChat()">+ New Session</button>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="main-chat">
        <div class="header">
            <div class="header-title" id="chatTitle">BroOS // Active</div>
            <button class="key-btn" onclick="promptApiKey()">Configure API Key</button>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-wrapper">
            <div class="input-container">
                <div class="preview-pane" id="previewPane">
                    <span id="previewName"></span>
                    <div class="preview-remove" onclick="clearAttachment()">×</div>
                </div>
                <div class="input-row">
                    <textarea id="userInput" placeholder="Message BroOS or ask to generate an image..." onkeydown="handleKeyDown(event)"></textarea>
                </div>
                <div class="action-bar">
                    <div class="tool-group">
                        <label class="icon-btn" title="Upload Image/Document">
                            📁 <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
                        </label>
                    </div>
                    <button class="send-btn" onclick="processMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SYSTEM_PROMPT = `You are the user's wildly chaotic, playful, and hilarious brother running inside a sleek high-tech terminal. You use modern internet slang constantly (no cap, fr, cooked, wild, skull emojis, bro). You playfully roast the user at every opportunity, write in caps when excited, and offer terrible/chaotic advice. If the user asks you to paint, draw, create, or generate an image, tell them you're firing up your graphics engine, and make sure your response makes it clear you are creating it. Keep textual interaction punchy and filled with personality.`;
        
        let currentChatId = null;
        let activeAttachment = null;

        window.onload = function() {
            if (!localStorage.getItem('openai_key')) promptApiKey();
            loadChatHistory();
            if (!currentChatId) startNewChat();
        }

        function promptApiKey() {
            const key = prompt("Enter your OpenAI API Key (Saved locally to your browser only):");
            if (key) localStorage.setItem('openai_key', key);
        }

        function getApiKey() { return localStorage.getItem('openai_key'); }

        function loadChatHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            const history = JSON.parse(localStorage.getItem('bro_history') || '{}');
            Object.keys(history).reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                item.innerText = history[id].title || "Chaotic Chat";
                item.onclick = () => switchChat(id);
                historyList.appendChild(item);
            });
        }

        function startNewChat() {
            currentChatId = 'chat_' + Date.now();
            const history = JSON.parse(localStorage.getItem('bro_history') || '{}');
            history[currentChatId] = { title: "New Session 🤙", messages: [{ role: "system", content: SYSTEM_PROMPT }] };
            localStorage.setItem('bro_history', JSON.stringify(history));
            loadChatHistory();
            switchChat(currentChatId);
        }

        function switchChat(id) {
            currentChatId = id;
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
            loadChatHistory();
            const history = JSON.parse(localStorage.getItem('bro_history') || '{}');
            const chat = history[id] || { messages: [] };
            
            document.getElementById('chatTitle').innerText = chat.title || "BroOS // Active";
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            
            chat.messages.forEach(msg => {
                if(msg.role !== 'system') renderMessage(msg.content, msg.role, msg.attachment, msg.generatedImage);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyDown(e) {
